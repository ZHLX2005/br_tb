<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sidebar-container">
    <!-- 顶部导航 -->
    <nav class="sidebar-nav">
      <button class="nav-btn active" data-page="groups">
        <span class="nav-icon">📋</span>
        <span class="nav-text">分组</span>
      </button>
      <button class="nav-btn" data-page="forms">
        <span class="nav-icon">📌</span>
        <span class="nav-text">Pin</span>
      </button>
      <button class="nav-btn" data-page="tabsearch">
        <span class="nav-icon">🔍</span>
        <span class="nav-text">Tab搜索</span>
      </button>
    </nav>

    <!-- 页面容器 -->
    <div class="page-container">
      <!-- 分组页面 -->
      <div id="page-groups" class="page active">
        <div class="page-header">
          <div class="group-selector">
            <select id="groupSelect">
              <option value="">-- 选择分组 --</option>
            </select>
          </div>
          <button id="refreshGroupsBtn" class="header-btn" title="刷新">🔄</button>
        </div>

        <div id="currentGroupInfo" class="group-info" style="display: none;">
          <div class="group-header">
            <span id="groupColor" class="group-color"></span>
            <span id="groupName" class="group-name"></span>
            <span id="tabCount" class="tab-count"></span>
          </div>
          <div class="group-actions">
            <button id="openAllBtn" class="action-btn">📂 打开全部</button>
            <button id="clearGroupBtn" class="action-btn danger">🗑️ 清空</button>
          </div>
        </div>

        <div id="tabList" class="tab-list">
          <div class="empty-hint">请选择一个分组查看标签</div>
        </div>
      </div>

      <!-- Pin 页面 -->
      <div id="page-forms" class="page">
        <div class="page-header">
          <h3>📌 Pin 面板</h3>
          <div class="header-actions">
            <button id="startPickerBtn" class="header-btn" title="拾取页面元素">🎯</button>
          </div>
        </div>

        <!-- 快速添加表单 -->
        <div id="quickAddForm" class="quick-add-form">
          <!-- 分组/标签选择按钮 + 新标签输入 -->
          <div class="tag-selector-row">
            <button id="tagSelectBtn" class="tag-select-btn">
              <span id="tagSelectLabel">选择分组</span>
              <span class="tag-select-arrow">▼</span>
            </button>
            <input type="text" id="quickTagInput" placeholder="或输入新标签" class="quick-tag-input">
            <div id="tagDropdown" class="tag-dropdown" style="display:none;">
              <div class="tag-dropdown-list" id="tagDropdownList"></div>
            </div>
          </div>
          <textarea id="quickContent" placeholder="输入内容..." class="quick-content"></textarea>
          <div class="quick-add-actions">
            <button id="quickAddBtn" class="action-btn btn-primary">添加</button>
            <button id="quickPickBtn" class="action-btn">🎯 拾取</button>
          </div>
        </div>

        <!-- 搜索框 -->
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="搜索内容..." class="search-input">
        </div>

        <!-- 标签筛选 -->
        <div id="tagFilterList" class="tag-filter-list">
        </div>

        <!-- 统计 -->
        <div class="pin-summary">
          <span id="tagCount">0</span> 个标签 · <span id="itemCount">0</span> 条记录
        </div>

        <!-- 拾取状态 -->
        <div id="pickerStatus" class="picker-status" style="display: none;">
          <span class="picker-hint">🎯 拾取中... 点击页面元素，ESC 取消</span>
        </div>

        <!-- 列表 -->
        <div class="form-list" id="formList">
          <div class="empty-hint">🎯 拾取或输入内容添加</div>
        </div>

        <!-- 底部操作 -->
        <div class="form-actions">
          <button id="importFormsBtn" class="action-btn">📥 导入</button>
          <button id="exportFormsBtn" class="action-btn">📤 导出</button>
          <button id="clearFormsBtn" class="action-btn danger">🗑️ 清空</button>
        </div>
      </div>

      <!-- Tab 搜索页面 -->
      <div id="page-tabsearch" class="page">
        <div class="page-header">
          <h3>🔍 Tab 搜索</h3>
          <div class="header-actions">
            <button id="refreshTabsBtn" class="header-btn" title="刷新">🔄</button>
          </div>
        </div>

        <!-- 搜索框 -->
        <div class="tabsearch-search-box">
          <input type="text" id="tabsearchInput" placeholder="输入关键词搜索... (支持模糊匹配)" class="tabsearch-input">
        </div>

        <!-- 搜索结果统计 -->
        <div id="tabsearchStats" class="tabsearch-stats">
          共 <span id="totalTabCount">0</span> 个标签页
        </div>

        <!-- Tab 列表 -->
        <div id="tabsearchList" class="tabsearch-list">
          <div class="empty-hint">输入关键词搜索标签页</div>
        </div>

        <!-- 底部提示 -->
        <div class="tabsearch-footer">
          <kbd>↑↓</kbd> 选择 · <kbd>Enter</kbd> 打开 · <kbd>Del</kbd> 关闭标签
        </div>
      </div>
    </div>

    <!-- 底部统计 -->
    <footer class="sidebar-footer">
      <span id="stats">加载中...</span>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
