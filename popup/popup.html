<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBoard</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="themes/neo-brutalism.css">
  <link rel="stylesheet" href="themes/classic.css">
  <link rel="stylesheet" href="themes/dark-cockpit.css">
  <link rel="stylesheet" href="themes/acid-graphics.css">
  <link rel="stylesheet" href="themes/japanese.css">
  <link rel="stylesheet" href="../shared/ModalDialog.css">
</head>
<body>
  <div class="app">
    <!-- 顶部导航 -->
    <nav class="top-nav" id="topNav">
      <div class="nav-tabs">
        <div class="nav-tab active" data-page="actions">
          <span class="nav-tab-icon"></span>
          <span class="nav-tab-label">快捷操作</span>
        </div>
        <div class="nav-tab" data-page="groups">
          <span class="nav-tab-icon"></span>
          <span class="nav-tab-label">分组管理</span>
        </div>
        <div class="nav-tab" data-page="focussearch">
          <span class="nav-tab-icon"></span>
          <span class="nav-tab-label">专注搜索</span>
        </div>
        <div class="nav-tab" data-page="videoprogress">
          <span class="nav-tab-icon"></span>
          <span class="nav-tab-label">视频进度</span>
        </div>
      </div>
      <button class="theme-btn" id="themeBtn" title="切换主题">
        <span class="theme-btn-dot"></span>
      </button>
    </nav>

    <!-- 页面容器 -->
    <div class="page-container">

      <!-- 快捷操作页 -->
      <div class="page active" id="page-actions">
        <div class="page-section">
          <div class="quick-actions-grid">
            <button id="collectAndOpenBtn" class="quick-action-btn">
              <span class="qa-icon"></span>
              <span class="qa-label">收集并打开看板</span>
            </button>
            <button id="collectOtherTabsBtn" class="quick-action-btn">
              <span class="qa-icon"></span>
              <span class="qa-label">收集其他标签页</span>
            </button>
            <button id="openTabboardBtn" class="quick-action-btn">
              <span class="qa-icon"></span>
              <span class="qa-label">打开看板</span>
            </button>
            <button id="openSidebarBtn" class="quick-action-btn">
              <span class="qa-icon"></span>
              <span class="qa-label">打开侧边栏</span>
            </button>
          </div>
        </div>

        <div class="page-section">
          <div class="section-title">自动录制</div>
          <div id="solutionContainer"></div>
        </div>

        <div class="page-section">
          <div class="section-title">基础设置</div>
          <div class="settings-list">
            <label class="setting-row">
              <input type="checkbox" id="closeAfterCollect">
              <span>收集后关闭标签页</span>
            </label>
            <label class="setting-row">
              <input type="checkbox" id="closeAfterRestore">
              <span>恢复后删除分组</span>
            </label>
            <label class="setting-row">
              <input type="checkbox" id="excludeEdgeUrls">
              <span>排除 edge:// 页面</span>
            </label>
            <label class="setting-row">
              <input type="checkbox" id="popupShowLcSidebar">
              <span>刷题侧边栏（LeetCode CN）</span>
            </label>
            <label class="setting-row">
              <input type="checkbox" id="popupShowGotoRing">
              <span>悬浮 goto 圆环（所有页面）</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 分组管理页 -->
      <div class="page" id="page-groups">
        <div class="page-header-row">
          <span class="page-section-title">分组列表</span>
          <button id="addGroupBtn" class="btn btn-small">+ 新建</button>
        </div>
        <div id="groupsList" class="groups-list">
          <!-- 动态生成 -->
        </div>
      </div>

      <!-- 专注搜索页 -->
      <div class="page" id="page-focussearch">
        <div class="page-section-title">专注搜索分组</div>
        <p class="focus-hint">勾选分组以添加到专注搜索对象</p>
        <div id="focusSearchGroupsList" class="focus-search-groups-list">
          <!-- 动态生成 -->
        </div>
      </div>

      <!-- 视频进度页 -->
      <div class="page" id="page-videoprogress">
        <div class="vp-actions-row">
          <button id="popupCaptureVideoBtn" class="btn btn-small">+ 捕获视频</button>
          <button id="popupRefreshVideoBtn" class="btn btn-secondary">&#x21bb; 刷新</button>
          <button id="popupOpenVideoPageBtn" class="btn btn-secondary">打开面板</button>
        </div>
        <div class="vp-settings-row">
          <label class="setting-row">
            <input type="checkbox" id="popupShowCourseProgressBar">
            <span>显示课程进度条</span>
          </label>
          <label class="setting-row">
            <input type="checkbox" id="popupShowBarOnUnrelatedTabs">
            <span>在无关网页也显示</span>
          </label>
        </div>
        <div id="vpCurrentVideo" class="vp-current-video">
          <!-- 当前视频检测信息 -->
        </div>
        <div id="videoProgressList" class="vp-list">
          <!-- 动态生成 -->
        </div>
      </div>

    </div>

    <!-- 主题选择浮层 -->
    <div class="theme-panel" id="themePanel">
      <div class="theme-panel-title">主题</div>
      <div class="theme-option active" data-theme="neo-brutalism">新粗野主义</div>
      <div class="theme-option" data-theme="classic">经典</div>
      <div class="theme-option" data-theme="dark-cockpit">深色座舱</div>
      <div class="theme-option" data-theme="acid-graphics">酸性图形</div>
      <div class="theme-option" data-theme="japanese">日式极简</div>
    </div>
  </div>

  <!-- 添加分组对话框 -->
  <div id="addGroupDialog" class="dialog">
    <div class="dialog-content">
      <h3>新建分组</h3>
      <div class="form-group">
        <label>分组名称</label>
        <input type="text" id="newGroupName" class="input" placeholder="输入分组名称">
      </div>
      <div class="form-group">
        <label>分组颜色</label>
        <div id="colorPicker" class="color-picker"></div>
      </div>
      <div class="dialog-actions">
        <button id="cancelAddGroup" class="btn btn-secondary">取消</button>
        <button id="confirmAddGroup" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <script src="../shared/ModalDialog.global.js"></script>
  <script src="popup-solution.js" type="module"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
