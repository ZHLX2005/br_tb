<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBoard 设置</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/ModalDialog.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📋 TabBoard</h1>
    </header>

    <!-- 快速操作 -->
    <section class="section section-actions">
      <button id="collectAndOpenBtn" class="btn-action btn-action-primary">
        <span class="btn-icon">📋</span>
        <span class="btn-text">收集并打开看板</span>
      </button>
      <button id="collectOtherTabsBtn" class="btn-action">
        <span class="btn-icon">📄</span>
        <span class="btn-text">收集其他标签页</span>
      </button>
      <button id="openTabboardBtn" class="btn-action">
        <span class="btn-icon">📁</span>
        <span class="btn-text">打开看板</span>
      </button>
      <button id="openSidebarBtn" class="btn-action">
        <span class="btn-icon">🗂️</span>
        <span class="btn-text">打开侧边栏</span>
      </button>
    </section>

    <!-- 自动录制 (折叠) -->
    <section class="section section-recording">
      <div class="section-toggle" id="recordingToggle">
        <h2>🎙️ 自动录制</h2>
        <span class="toggle-icon">▼</span>
      </div>
      <div id="recordingContent" class="recording-content">
        <div id="solutionContainer">
          <!-- 解决方案录制UI动态生成 -->
        </div>
      </div>
    </section>

    <!-- 分组管理 -->
    <section class="section">
      <div class="section-header">
        <h2>分组管理</h2>
        <button id="addGroupBtn" class="btn btn-small">+ 新建</button>
      </div>
      <div id="groupsList" class="groups-list">
        <!-- 分组列表动态生成 -->
      </div>
    </section>

    <!-- 设置 -->
    <section class="section section-settings">
      <div class="settings-row">
        <label class="setting-item">
          <input type="checkbox" id="closeAfterCollect">
          <span>收集后关闭</span>
        </label>
        <label class="setting-item">
          <input type="checkbox" id="closeAfterRestore">
          <span>恢复后删除</span>
        </label>
        <label class="setting-item">
          <input type="checkbox" id="excludeEdgeUrls">
          <span>排除 edge://</span>
        </label>
      </div>
    </section>
  </div>

  <!-- 添加分组对话框 -->
  <div id="addGroupDialog" class="dialog">
    <div class="dialog-content">
      <h3>新建分组</h3>
      <div class="form-group">
        <label>分组名称</label>
        <input type="text" id="newGroupName" class="input" placeholder="输入分组名称">
      </div>
      <div class="form-group">
        <label>分组颜色</label>
        <div id="colorPicker" class="color-picker">
          <!-- 颜色选项动态生成 -->
        </div>
      </div>
      <div class="dialog-actions">
        <button id="cancelAddGroup" class="btn btn-secondary">取消</button>
        <button id="confirmAddGroup" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <script src="../shared/ModalDialog.global.js"></script>
  <script src="popup-solution.js"></script>
  <script src="popup.js"></script>
</body>
</html>
