<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>划词翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h2 class="title">划词翻译</h2>
      <div class="version">v1.0</div>
    </div>

    <div class="main-content">
      <!-- 快速翻译输入区 -->
      <div class="translate-section">
        <textarea
          id="textInput"
          class="text-input"
          placeholder="输入要翻译的文本..."
          rows="3"
        ></textarea>
        <button id="translateBtn" class="translate-btn">翻译</button>
      </div>

      <!-- 翻译结果显示区 -->
      <div id="resultSection" class="result-section" style="display: none;">
        <div class="result-header">
          <span class="result-label">翻译结果：</span>
          <button id="copyResultBtn" class="copy-btn">复制</button>
        </div>
        <div id="resultText" class="result-text"></div>
      </div>

      <!-- 统计信息 -->
      <div class="stats-section">
        <div class="stat-item">
          <span class="stat-label">今日翻译：</span>
          <span id="todayCount" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">总计翻译：</span>
          <span id="totalCount" class="stat-value">0</span>
        </div>
      </div>

      <!-- 功能开关 -->
      <div class="settings-section">
        <label class="setting-item">
          <input type="checkbox" id="autoTranslate" class="toggle">
          <span class="toggle-label">自动翻译（选中文本后自动显示翻译）</span>
        </label>
        <label class="setting-item">
          <input type="checkbox" id="showContextMenu" class="toggle" checked>
          <span class="toggle-label">显示右键菜单</span>
        </label>
      </div>

      <!-- 划词翻译设置 -->
      <div class="ocr-section">
        <div class="section-title">
          <span>📝 划词翻译设置</span>
        </div>
        <div class="ocr-setting-item">
          <label class="setting-label">提示词模板</label>
          <textarea
            id="selectionPromptInput"
            class="ocr-textarea"
            placeholder="请输入提示词，使用 %s 作为选中文本的占位符..."
            rows="2"
          >请解释 %s</textarea>
          <small style="color: #6c757d; font-size: 12px; margin-top: 4px; display: block;">
            使用 %s 代表选中的文本，例如："请翻译 %s"、"请解释 %s 的含义"
          </small>
        </div>
        <label class="setting-item" style="margin-top: 12px;">
          <input type="checkbox" id="selectionStreamToggle" class="toggle" checked>
          <span class="toggle-label">流式输出（实时显示处理结果）</span>
        </label>
      </div>

      <!-- 收藏设置 -->
      <div class="ocr-section">
        <div class="section-title">
          <span>⭐ 收藏设置</span>
        </div>
        <div class="ocr-setting-item">
          <label class="setting-label">快捷键</label>
          <div class="shortcut-input-wrapper">
            <input
              type="text"
              id="favoritesShortcutInput"
              class="shortcut-input"
              placeholder="点击设置快捷键..."
              readonly
            >
            <button id="clearFavoritesShortcutBtn" class="shortcut-clear-btn" title="清除快捷键">✕</button>
          </div>
          <small style="color: #6c757d; font-size: 12px; margin-top: 4px; display: block;">
            选中文字后，按下快捷键即可收藏
          </small>
        </div>
      </div>

      <!-- OCR 设置 -->
      <div class="ocr-section">
        <div class="section-title">
          <span>📷 OCR 设置</span>
        </div>
        <div class="ocr-setting-item">
          <label class="setting-label">识别提示词</label>
          <textarea
            id="ocrPromptInput"
            class="ocr-textarea"
            placeholder="请输入 OCR 识别的提示词..."
            rows="2"
          >请识别图片中的所有文字内容</textarea>
        </div>
        <label class="setting-item" style="margin-top: 12px;">
          <input type="checkbox" id="ocrStreamToggle" class="toggle">
          <span class="toggle-label">流式输出（实时显示识别结果）</span>
        </label>
        <label class="setting-item" style="margin-top: 12px;">
          <input type="checkbox" id="ocrThinkingToggle" class="toggle">
          <span class="toggle-label">思考模式（显示 AI 推理过程）</span>
        </label>

        <!-- 流速控制 -->
        <div id="flowRateControl" class="flow-rate-control" style="display: none; margin-top: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="setting-label" style="margin: 0;">输出速度</label>
            <span id="flowRateValue" class="flow-rate-value">中等</span>
          </div>
          <input
            type="range"
            id="flowRateSlider"
            class="flow-rate-slider"
            min="1"
            max="5"
            step="1"
            value="3"
          >
          <div style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: #6c757d;">
            <span>慢速</span>
            <span>较快</span>
          </div>
          <div id="flowRateWarning" class="flow-rate-warning" style="display: none;">
            ⚠️ 输出速度较快可能导致页面卡顿
          </div>
        </div>
        <div class="ocr-setting-item" style="margin-top: 12px;">
          <label class="setting-label">快捷键</label>
          <div class="shortcut-input-wrapper">
            <input
              type="text"
              id="ocrShortcutInput"
              class="shortcut-input"
              placeholder="点击设置快捷键..."
              readonly
            >
            <button id="clearShortcutBtn" class="shortcut-clear-btn" title="清除快捷键">✕</button>
          </div>
          <small style="color: #6c757d; font-size: 12px; margin-top: 4px; display: block;">
            点击输入框，然后按下键盘组合键（如 Ctrl+Shift+O）
          </small>
        </div>
      </div>
    </div>

    <div class="footer">
      <button id="ocrBtn" class="footer-btn">📷 OCR识别</button>
      <button id="bookmarksBtn" class="footer-btn">🔖 书签管理</button>
      <button id="historyBtn" class="footer-btn">查看历史</button>
      <button id="settingsBtn" class="footer-btn">设置</button>
      <button id="aboutBtn" class="footer-btn">关于</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
