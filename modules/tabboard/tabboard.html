<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBoard - 标签页看板</title>
  <!-- jKanban CSS -->
  <link rel="stylesheet" href="../shared/lib/jkanban.min.css">
  <link rel="stylesheet" href="tabboard.css">
  <link rel="stylesheet" href="../group/style.css">
  <link rel="stylesheet" href="../timeline/style.css">
  <link rel="stylesheet" href="../leetcode/style.css">
  <link rel="stylesheet" href="../timer/style.css">
  <link rel="stylesheet" href="../bilibili-history/style.css">
  <link rel="stylesheet" href="../recording/recording.css">
  <link rel="stylesheet" href="../video-progress/style.css">
  <!-- 共享模态对话框样式:被 modules/group、modules/recording、modules/timeline、modules/video-progress 等多个 view.js 共同通过 import { modal } from '../../shared/ModalDialog.js' 使用 -->
  <link rel="stylesheet" href="../../shared/ModalDialog.css">
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <header class="header">
      <div class="header-left">
        <h1>TabBoard</h1>
        <span class="stats" id="stats">加载中...</span>
      </div>
      <div class="header-right">
        <nav class="view-nav">
          <button id="timelineViewBtn" class="nav-btn active" title="时序视图">Time</button>
          <button id="groupViewBtn" class="nav-btn" title="分组视图">Board</button>
          <button id="recordingViewBtn" class="nav-btn" title="标签录制">Rec</button>
          <button id="videoProgressViewBtn" class="nav-btn" title="视频进度">Video</button>
          <button id="moreViewBtn" class="nav-btn" title="更多视图" aria-haspopup="true" aria-expanded="false">More <span aria-hidden="true">▾</span></button>
        </nav>
        <div class="header-actions">
          <button id="refreshBtn" class="btn btn-secondary" title="刷新">Refresh</button>
        </div>
      </div>
    </header>

    <!-- 时序视图 -->
    <div id="timelineView" class="view-container">
      <div class="timeline-header">
        <div class="timeline-search-container">
          <input type="text" id="timelineSearch" class="timeline-search-input" placeholder="搜索标题或URL (支持模糊匹配，如 gb 匹配 github)...">
        </div>
      </div>
      <div id="timelineList" class="timeline-list"></div>
    </div>

    <!-- 分组视图 -->
    <div id="groupView" class="view-container" style="display: none;">
      <div id="tabboard"></div>
    </div>

    <!-- LeetCode 视图 -->
    <div id="leetcodeView" class="view-container" style="display: none;">
      <div id="leetcodePanel"></div>
    </div>

    <!-- Timer 视图 -->
    <div id="timerView" class="view-container" style="display: none;">
      <div id="timerPanel"></div>
    </div>

    <!-- B 站历史视图 (Task 2 临时挂载，Task 7 正式接入) -->
    <div id="bilibiliHistoryView" class="view-container" style="display: none;">
      <div id="bilibiliHistoryPanel"></div>
    </div>

    <!-- 录制视图(内嵌,与 tabboard 共用 shell/主题,避免 chrome-extension:// 跳转) -->
    <div id="recordingView" class="view-container" style="display: none;">
      <div class="recording-content">
        <section id="recordingStatus" class="recording-status-section"></section>
        <section class="recordings-section">
          <div class="section-header">
            <h2 class="section-title">历史录制</h2>
            <span id="recordingCount" class="count-badge">0</span>
          </div>
          <div id="recordingsList" class="recordings-list"></div>
        </section>
      </div>
    </div>

    <!-- 视频进度视图(内嵌) -->
    <div id="videoProgressView" class="view-container" style="display: none;">
      <div class="video-progress-content">
        <header class="vp-header">
          <div class="vp-header-left">
            <h2 id="vpPageTitle">视频进度</h2>
            <p class="subtitle" id="vpSubtitle">聚合追踪课程视频观看进度</p>
          </div>
          <div class="vp-header-actions">
            <button id="vpBatchImportBtn" class="btn">批量导入</button>
            <button id="vpAddGroupBtn" class="btn">新建课程</button>
            <button id="vpArchiveToggleBtn" class="btn">查看归档</button>
            <button id="vpBackToActiveBtn" class="btn" style="display: none;">返回</button>
          </div>
        </header>
        <section id="videoStats"></section>
        <section class="groups-section">
          <div id="videoGroupsList"></div>
        </section>
        <section id="archiveSection" class="archive-section" style="display: none;">
          <div class="archive-header">
            <h2 class="archive-title">已归档</h2>
            <p class="archive-subtitle">记录学习足迹</p>
          </div>
          <div id="archivedGroupsList"></div>
        </section>

        <!-- 批量导入 inline dialog (长进度条需持久 DOM,不切到 modal) -->
        <div id="batchImportDialog" class="video-progress-dialog">
          <div class="dialog-content">
            <h3>批量导入视频</h3>
            <div class="form-group">
              <label>目标课程</label>
              <select id="batchGroupSelect" class="input"></select>
            </div>
            <div class="form-group">
              <label>视频链接(一行一个)</label>
              <textarea id="batchUrlInput" class="input" rows="8" placeholder="https://www.bilibili.com/video/BV1xxx&#10;https://www.bilibili.com/video/BV2xxx"></textarea>
            </div>
            <div class="form-group">
              <label>或上传 txt 文件</label>
              <input type="file" id="batchFileInput" accept=".txt" class="input" style="padding: 6px;">
            </div>
            <div id="batchProgress" class="batch-progress"></div>
            <div class="dialog-actions">
              <button id="batchCancelBtn" class="btn btn-secondary">取消</button>
              <button id="batchConfirmBtn" class="btn btn-primary">开始导入</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon"></div>
      <h2>暂无标签页</h2>
      <p>使用快捷键或扩展弹窗收集标签页：</p>
      <div class="shortcuts-hint">
        <kbd>Alt+Shift+A</kbd> 添加到默认分组
        <kbd>Alt+Shift+C</kbd> 收集所有到时序
      </div>
    </div>
  </div>

  <!-- jKanban JS -->
  <script src="../shared/lib/jkanban.min.js"></script>
  <!-- 主入口文件 - 使用 ES6 模块 -->
  <script type="module" src="tabboard.js"></script>
</body>
</html>
