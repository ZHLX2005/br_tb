<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBoard - 标签页看板</title>
  <!-- jKanban CSS -->
  <link rel="stylesheet" href="lib/jkanban.min.css">
  <link rel="stylesheet" href="tabboard.css">
  <link rel="stylesheet" href="../../shared/ModalDialog.css">
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <header class="header">
      <div class="header-left">
        <h1>📋 TabBoard</h1>
        <span class="stats" id="stats">加载中...</span>
      </div>
      <div class="header-right">
        <nav class="view-nav">
          <button id="timelineViewBtn" class="nav-btn active" title="时序视图">🕐</button>
          <button id="groupViewBtn" class="nav-btn" title="分组视图">📁</button>
          <button id="recordingViewBtn" class="nav-btn" title="标签录制">🎯</button>
        </nav>
        <div class="header-actions">
          <button id="refreshBtn" class="btn btn-secondary" title="刷新">🔄</button>
        </div>
      </div>
    </header>

    <!-- 时序视图 -->
    <div id="timelineView" class="view-container">
      <div id="timelineList" class="timeline-list"></div>
    </div>

    <!-- 分组视图 -->
    <div id="groupView" class="view-container" style="display: none;">
      <div id="tabboard"></div>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon">📭</div>
      <h2>暂无标签页</h2>
      <p>使用快捷键或扩展弹窗收集标签页：</p>
      <div class="shortcuts-hint">
        <kbd>Alt+Shift+A</kbd> 添加到默认分组
        <kbd>Alt+Shift+C</kbd> 收集所有到时序
      </div>
    </div>
  </div>

  <!-- jKanban JS -->
  <script src="lib/jkanban.min.js"></script>
  <!-- 主入口文件 - 使用 ES6 模块 -->
  <script type="module" src="tabboard.js"></script>
</body>
</html>
