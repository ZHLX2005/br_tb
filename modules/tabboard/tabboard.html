<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBoard - 标签页看板</title>
  <link rel="stylesheet" href="tabboard.css">
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <header class="header">
      <div class="header-left">
        <h1>📋 TabBoard</h1>
        <span class="stats" id="stats">加载中...</span>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="btn btn-secondary" title="刷新">🔄</button>
        <button id="settingsBtn" class="btn btn-secondary" title="设置">⚙️</button>
      </div>
    </header>

    <!-- 看板容器 -->
    <div class="board" id="board">
      <!-- 分组列动态生成 -->
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon">📭</div>
      <h2>暂无标签页</h2>
      <p>使用快捷键收集标签页：</p>
      <div class="shortcuts-hint">
        <kbd>Alt+Shift+A</kbd> 添加当前标签
        <kbd>Alt+Shift+C</kbd> 收集所有标签
      </div>
    </div>
  </div>

  <!-- 标签卡片模板 -->
  <template id="tabCardTemplate">
    <div class="tab-card" draggable="true">
      <div class="tab-header">
        <img class="tab-favicon" src="" alt="" onerror="this.style.display='none'">
        <span class="tab-title"></span>
        <button class="tab-delete" title="删除">×</button>
      </div>
      <div class="tab-url"></div>
      <div class="tab-time"></div>
    </div>
  </template>

  <script src="tabboard.js"></script>
</body>
</html>
