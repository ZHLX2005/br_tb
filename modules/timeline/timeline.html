<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBoard - 时序视图</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../../shared/ModalDialog.css">
  <link rel="stylesheet" href="timeline.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1>TabBoard</h1>
        <span class="stats" id="stats">加载中...</span>
      </div>
      <div class="header-right">
        <div class="header-actions">
          <button id="refreshBtn" class="btn btn-secondary" title="刷新">Refresh</button>
        </div>
      </div>
    </header>

    <div class="view-container">
      <div class="timeline-header">
        <div class="timeline-search-container">
          <input type="text" id="timelineSearch" class="timeline-search-input" placeholder="搜索标题或URL (支持模糊匹配，如 gb 匹配 github)...">
        </div>
      </div>
      <div id="timelineList" class="timeline-list"></div>
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon"></div>
      <h2>暂无标签页</h2>
      <p>使用快捷键或扩展弹窗收集标签页：</p>
      <div class="shortcuts-hint">
        <kbd>Alt+Shift+A</kbd> 添加到默认分组
        <kbd>Alt+Shift+C</kbd> 收集所有到时序
      </div>
    </div>
  </div>

  <script type="module" src="../shared/nav.js"></script>
  <script type="module" src="timeline.js"></script>
</body>
</html>
