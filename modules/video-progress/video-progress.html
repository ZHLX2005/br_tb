<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频进度 - TabBoard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../shared/ModalDialog.css">
</head>
<body>
  <div class="video-progress-container">
    <!-- Header -->
    <header class="vp-header">
      <div class="vp-header-left">
        <h1>视频进度</h1>
        <p class="subtitle">聚合追踪课程视频观看进度</p>
      </div>
      <div class="vp-header-actions">
        <button id="batchImportBtn" class="btn btn-secondary">批量导入</button>
        <button id="addGroupBtn" class="btn btn-secondary">新建课程</button>
        <button id="archivePageBtn" class="btn btn-secondary">查看归档</button>
        <button id="normalizeUrlsBtn" class="btn btn-secondary" title="移除视频链接中的 ?p=1 参数">整理链接</button>
        <button id="backBtn" class="btn btn-secondary">返回看板</button>
      </div>
    </header>

    <!-- Stats -->
    <section id="videoStats">
      <!-- Dynamic content -->
    </section>

    <!-- 批量导入对话框 -->
    <div id="batchImportDialog" class="dialog">
      <div class="dialog-content" style="max-width: 520px;">
        <h3>批量导入视频</h3>
        <div class="form-group">
          <label>目标课程</label>
          <select id="batchGroupSelect" class="input"></select>
        </div>
        <div class="form-group">
          <label>视频链接（一行一个）</label>
          <textarea id="batchUrlInput" class="input" rows="8" placeholder="https://www.bilibili.com/video/BV1xxx&#10;https://www.bilibili.com/video/BV2xxx"></textarea>
        </div>
        <div class="form-group">
          <label>或上传 txt 文件</label>
          <input type="file" id="batchFileInput" accept=".txt" class="input" style="padding: 6px;">
        </div>
        <div id="batchProgress" class="batch-progress"></div>
        <div class="dialog-actions">
          <button id="batchCancelBtn" class="btn btn-secondary">取消</button>
          <button id="batchConfirmBtn" class="btn btn-primary">开始导入</button>
        </div>
      </div>
    </div>

    <!-- Groups List -->
    <section class="groups-section">
      <div id="videoGroupsList">
        <!-- Dynamic content -->
      </div>
    </section>

  </div>

  <script type="module" src="video-progress-shell.js"></script>
</body>
</html>
