<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR 截图识别</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
      line-height: 1.6;
      background: #f5f5f5;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    h1 {
      color: #495057;
      border-bottom: 3px solid #dee2e6;
      padding-bottom: 15px;
      margin-bottom: 30px;
      font-size: 28px;
      display: flex;
      align-items: center;
    }
    h1::before {
      content: '📷';
      margin-right: 10px;
    }
    .actions-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: #6c757d;
      color: white;
    }
    .btn-primary:hover {
      background: #5a6268;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
    }
    .btn-primary:disabled {
      background: #adb5bd;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #e9ecef;
      color: #495057;
    }
    .btn-secondary:hover {
      background: #dee2e6;
    }
    .preview-section {
      margin-bottom: 30px;
    }
    .preview-header {
      font-size: 16px;
      font-weight: 600;
      color: #495057;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e9ecef;
    }
    .image-preview {
      max-width: 100%;
      border-radius: 8px;
      border: 2px solid #e9ecef;
      display: block;
      margin-bottom: 15px;
    }
    .image-preview.has-image {
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .result-section {
      margin-top: 30px;
    }
    .result-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #6c757d;
      min-height: 100px;
    }
    .result-text {
      color: #333;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .result-placeholder {
      color: #999;
      text-align: center;
      padding: 30px;
    }
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #6c757d;
    }
    .loading::before {
      content: '';
      width: 20px;
      height: 20px;
      border: 3px solid #e9ecef;
      border-top-color: #6c757d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .info-box {
      background: #e7f5ff;
      border-left: 4px solid #6c757d;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #495057;
      font-size: 14px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #6c757d;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state::before {
      content: '📸';
      display: block;
      font-size: 60px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .container {
        padding: 20px;
      }
      .actions-bar {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OCR 截图识别</h1>

    <div class="info-box">
      💡 点击"截取当前页面"按钮，自动截取当前标签页的可见区域并进行 OCR 文字识别
    </div>

    <div class="actions-bar">
      <button id="captureBtn" class="btn btn-primary">
        📸 截取当前页面
      </button>
      <button id="recognizeBtn" class="btn btn-primary" disabled>
        🔍 开始识别
      </button>
      <button id="clearBtn" class="btn btn-secondary">
        🗑️ 清空
      </button>
    </div>

    <div class="status-bar" id="statusBar" style="display: none;">
      <span id="statusText">就绪</span>
      <span id="imageInfo"></span>
    </div>

    <div class="preview-section" id="previewSection" style="display: none;">
      <div class="preview-header">📷 截图预览</div>
      <img id="imagePreview" class="image-preview" alt="截图预览">
    </div>

    <div class="result-section" id="resultSection" style="display: none;">
      <div class="preview-header">📝 识别结果</div>
      <div class="result-box">
        <div id="resultText" class="result-text"></div>
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      暂无截图<br>请点击"截取当前页面"开始使用
    </div>
  </div>

  <script src="ocr-screenshot.js"></script>
</body>
</html>
